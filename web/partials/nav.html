<dialog class="settings" data-settings aria-labelledby="settings-title">
  <form method="dialog" class="settings__form">
    <header class="settings__head">
      <h2 id="settings-title">Appearance &amp; motion</h2>
      <button class="nav__icon" value="close" aria-label="Close settings">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M4 4l8 8M12 4l-8 8" /></svg>
      </button>
    </header>
    <fieldset class="seg">
      <legend>Theme</legend>
      <div class="seg__row">
        <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
        <label><input type="radio" name="theme" value="system"><span>System</span></label>
      </div>
      <p class="seg__status" data-status="theme" aria-live="polite"></p>
    </fieldset>
    <fieldset class="seg">
      <legend>Motion</legend>
      <div class="seg__row">
        <label><input type="radio" name="motion" value="system"><span>System</span></label>
        <label><input type="radio" name="motion" value="reduced"><span>Reduced</span></label>
        <label><input type="radio" name="motion" value="full"><span>Full</span></label>
      </div>
      <p class="seg__status" data-status="motion" aria-live="polite"></p>
    </fieldset>
    <p class="settings__note">Saved on this device only.</p>
  </form>
</dialog>
